# Optional settings. Copy beside mounts.tsv as automation.conf with mode 600.
# This is literal KEY=value data, never executable shell configuration.
# Defaults preserve the one-command workflow. Set individual switches to no/off.
SSH_MASTER=yes
TAILSCALE=auto
DELTA_LOGIN=~/.ssh/delta-login
AUTO_PROVISION=yes
AUTO_FORCE=yes
DIRECT_FALLBACK=yes
SMB_REMOTE=perception
SMB_SHARE=share
RCLONE_CONFIG=~/.config/rclone/rclone.conf
